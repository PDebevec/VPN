<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>setup</title>
    <link href="../assets/style/handleIframe.css" rel="stylesheet" />
    <link href="../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container-fluid pe-5">
        <div class="row mb-2" id="server-cert">
            <label for="cert" class="col-sm-3 col-form-label">Server Certificate</label>
            <div class="col-sm-9 input-group">
                <input type="file" class="form-control" id="cert" tabindex="1" accept=".crt">
            </div>
        </div>
        <div class="row mb-2" id="server-key">
            <label for="key" class="col-sm-3 col-form-label">Server Key</label>
            <div class="col-sm-9 input-group">
                <input type="file" class="form-control" id="key" tabindex="2" accept=".key">
            </div>
            <a href="#" id="create-keycert">Create SSL certificate.</a>
            <a href="#" id="create-keypair">Create RSA key pair.</a>
        </div>
        <div class="row mb-2" id="client-key">
            <label for="encryption" class="col-sm-3 col-form-label">Public Key</label>
            <div class="col-sm-9 input-group">
                <input type="file" class="form-control" id="public" tabindex="3" accept=".key">
            </div>
        </div>
        <div class="row mb-2">
            <label for="primary" class="col-sm-3 col-form-label">Server IP</label>
            <div class="col-sm-9 input-group">
                <input type="text" class="form-control" id="primary" tabindex="4">
            </div>
        </div>
        <div class="row mb-2">
            <label for="port" class="col-sm-3 col-form-label">Server Port</label>
            <div class="col-sm-9 input-group">
                <input type="number" class="form-control" id="port" min="1" max="65535" tabindex="5">
            </div>
        </div>
        <div class="row mb-2" id="local-ips">
            <label for="primary" class="col-sm-3 col-form-label">Internal IP Range</label>
            <div class="col-sm-9 input-group">
                <input type="text" class="form-control" id="low" tabindex="6">
                <input type="text" class="form-control" id="high" tabindex="7">
            </div>
        </div>
        <div class="row">
            <div class="col-sm-10">
                <button type="button" class="btn btn-primary" id="confirm">Confirm</button>
                <button type="button" class="btn btn-primary" id="clear">Clear</button>
            </div>
        </div>
    </div>
</body>
</html>
