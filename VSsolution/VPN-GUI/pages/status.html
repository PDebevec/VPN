<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>status</title>
    <link href="../assets/style/handleIframe.css" rel="stylesheet" />
    <link href="../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col-md-8 offset-md-2">
                <div class="card text-center" id="info-card">
                    <div class="card-body">
                        <h6 id="status-text" class="card-text mb-0"></h6>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <button id="start-stop" class="btn btn-primary">Toggle VPN</button>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            HTTPS <span class="badge bg-danger">OFF</span>
                        </li>
                        <li class="list-group-item">
                            TUNNEL <span class="badge bg-danger">OFF</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="card text-center" id="error-card">
                    <div class="card-body">
                        <h6 id="error-message"></h6>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
